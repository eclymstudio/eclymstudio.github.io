<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ECLYM Studio creates entertainment and software experiences, including games, mobile applications, web services, and digital tools.">
  <title>ECLYM Studio</title>
  <style>
    :root {
      --bg: #0b0d10;
      --panel: #12161b;
      --text: #f5f7f8;
      --muted: #9ca6b1;
      --line: #232a32;
      --accent: #d7dde3;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 20% 10%, rgba(255,255,255,.055), transparent 28rem),
        var(--bg);
      color: var(--text);
    }

    a { color: inherit; text-decoration: none; }

    .wrap {
      width: min(1120px, calc(100% - 48px));
      margin: 0 auto;
    }

    header {
      height: 84px;
      display: flex;
      align-items: center;
      border-bottom: 1px solid var(--line);
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: .18em;
    }

    .privacy-link {
      color: var(--muted);
      font-size: 14px;
      transition: color .2s ease;
    }

    .privacy-link:hover { color: var(--text); }

    .hero {
      min-height: 62vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 88px 0;
    }

    .eyebrow {
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .26em;
      font-size: 12px;
      margin-bottom: 22px;
    }

    h1 {
      margin: 0;
      max-width: 820px;
      font-size: clamp(56px, 9vw, 118px);
      line-height: .88;
      letter-spacing: -.055em;
      font-weight: 800;
    }

    .tagline {
      margin-top: 32px;
      color: var(--muted);
      font-size: clamp(18px, 2vw, 24px);
      letter-spacing: .06em;
    }

    .areas {
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    .area {
      padding: 54px 0 64px;
    }

    .area:first-child {
      padding-right: 56px;
      border-right: 1px solid var(--line);
    }

    .area:last-child {
      padding-left: 56px;
    }

    .number {
      color: var(--muted);
      font-size: 12px;
      letter-spacing: .15em;
      margin-bottom: 30px;
    }

    h2 {
      margin: 0 0 16px;
      font-size: clamp(28px, 4vw, 44px);
      letter-spacing: -.035em;
    }

    .area p {
      margin: 0;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.7;
    }

    footer {
      padding: 42px 0 52px;
    }

    .footer-inner {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      color: var(--muted);
      font-size: 13px;
    }

    .footer-links {
      display: flex;
      gap: 22px;
      flex-wrap: wrap;
    }

    .footer-links a:hover { color: var(--text); }

    @media (max-width: 720px) {
      .wrap { width: min(100% - 32px, 1120px); }
      header { height: 72px; }
      .hero { min-height: 56vh; padding: 72px 0; }
      .areas { grid-template-columns: 1fr; }
      .area { padding: 42px 0 48px !important; }
      .area:first-child {
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }
      .footer-inner {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap nav">
      <a class="brand" href="/">ECLYM STUDIO</a>
      <a class="privacy-link" href="/privacy-policy.html">Privacy</a>
    </div>
  </header>

  <main>
    <section class="wrap hero">
      <div class="eyebrow">Independent Digital Studio</div>
      <h1>ECLYM<br>STUDIO</h1>
      <div class="tagline">ENTERTAINMENT · SOFTWARE</div>
    </section>

    <section class="wrap areas" aria-label="Business areas">
      <article class="area">
        <div class="number">01</div>
        <h2>Entertainment</h2>
        <p>Games · Interactive Content · Digital Entertainment</p>
      </article>

      <article class="area">
        <div class="number">02</div>
        <h2>Software</h2>
        <p>Mobile Applications · Web Services · Digital Tools</p>
      </article>
    </section>
  </main>

  <footer>
    <div class="wrap footer-inner">
      <div>© 2026 ECLYM Studio</div>
      <div class="footer-links">
        <a href="/privacy-policy.html">Privacy Policy</a>
        <a href="mailto:ECLYMstudio@gmail.com">Contact</a>
      </div>
    </div>
  </footer>
</body>
</html>
